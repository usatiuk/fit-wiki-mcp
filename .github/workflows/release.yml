name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      dry_run:
        description: "Run without pushing, publishing, or creating a GitHub release"
        required: true
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: Release actor guard
    runs-on: ubuntu-latest
    steps:
      - name: Require repository owner
        if: ${{ github.actor != 'usatiuk' }}
        run: |
          echo "Only usatiuk can run this release workflow." >&2
          exit 1

      - name: Confirm release actor
        run: |
          echo "Release actor authorized: ${{ github.actor }}"

  prepare:
    name: Prepare release
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm install -g npm@^11.10.0
      - run: npm ci
      - run: npm run check

      - name: Bump package version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            npm --no-git-tag-version version "$BUMP"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            npm version "$BUMP" -m "Release %s"
          fi
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - run: npm run build
      - run: npm pack --dry-run

      - name: Push release commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git push origin HEAD:main
          git push origin "$TAG"

  publish:
    name: Publish npm package
    needs:
      - guard
      - prepare
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm install -g npm@^11.10.0
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
      - run: npm publish

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release create "$TAG" --title "$TAG" --generate-notes
